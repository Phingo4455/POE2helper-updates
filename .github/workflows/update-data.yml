name: Update POE2 data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: poe2-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Monitor campaign guide source
        id: guide_monitor
        run: npm run monitor:guide

      - name: Synchronize and validate POE2 data
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # POE2DB is contacted only by the fixed daily schedule (18:17 UTC).
          # Manual reruns reuse the last validated tablet cache.
          ALLOW_POE2DB_REFRESH: ${{ github.event_name == 'schedule' && '1' || '0' }}

      - name: Publish changed data
        shell: bash
        run: |
          if git diff --quiet -- latest monitor; then
            echo "No upstream POE2 data changes."
          else
            version=$(node -p "require('./latest/manifest.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest monitor
            git commit -m "data: publish ${version}"
            git push
          fi

      - name: Open route review reminder
        if: steps.guide_monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_REVISION: ${{ steps.guide_monitor.outputs.previous_revision }}
          CURRENT_REVISION: ${{ steps.guide_monitor.outputs.current_revision }}
        run: |
          gh issue create \
            --title "路线信源已更新：POE2 Wiki revision ${CURRENT_REVISION}" \
            --body "POE2 Wiki Acts quick guide 已从 revision ${PREVIOUS_REVISION} 更新到 ${CURRENT_REVISION}。请核对赛季剧情变化，并更新 manual/poe2-campaign-guide.json 的中文路线、gameVersion、guideVersion、sourceRevision 与 releaseNotes。\n\n来源：https://www.poe2wiki.net/wiki/Guide:Acts_quick_guide"
